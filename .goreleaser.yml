# Release build (ADR-0018), in the layout both the OpenTofu and the Terraform registry expect.
# Runs from .github/workflows/release.yml on `v*` tags. Check locally with
# `goreleaser release --snapshot --clean --skip=sign`.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      # The registries want a binary detached signature, not an armored one.
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # Only tags with a semver pre-release suffix (e.g. v0.1.0-rc1) become GitHub pre-releases.
  # v0.0.x tags are pre-1.0 releases in the semver sense (ADR-0019) but normal GitHub releases.
  prerelease: auto

changelog:
  disable: true
