version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        # Every resource implements the same framework interface methods (Metadata, Schema,
        # Read, ...); doc comments on each would be noise.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/toelke/terraform-provider-homeassistant
